<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit movie</title>
</head>

<body>
    <h1>Edit movie</h1>
    <form th:action="@{/movies/edit}" th:object="${editMovie}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Name">
        <br><br>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              style="color:red"></span>
        <br><br>

        <label>Year</label>
        <input type="number" th:field="*{year}" placeholder="Year">
        <br><br>
        <span th:if="${#fields.hasErrors('year')}"
              th:errors="*{year}"
              style="color:red"></span>
        <br><br>

        <label>Director</label>
        <input type="text" th:field="*{director}" placeholder="Director">
        <br><br>
        <span th:if="${#fields.hasErrors('director')}"
              th:errors="*{director}"
              style="color:red"></span>
        <br><br>

        <input type="hidden" th:field="*{id}">
        <button type="submit">Edit</button>
        <a th:href="@{/movies}">
            Go back
        </a>




    </form>

</body>
