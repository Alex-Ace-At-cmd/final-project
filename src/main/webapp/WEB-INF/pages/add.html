<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add movies</title>
</head>

<body>
    <h1>Add new movies</h1>
    <form th:action="@{/movies/add}" th:object="${newMovie}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Name">
        <br><br>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              style="color:red"></span>

        <label>Year</label>
        <input type="number" th:field="*{year}" placeholder="Year">
        <br><br>
        <span th:if="${#fields.hasErrors('year')}"
              th:errors="*{year}"
              style="color:red"></span>

        <label>Director</label>
        <input type="text" th:field="*{director}" placeholder="Director">
        <span th:if="${#fields.hasErrors('director')}"
              th:errors="*{director}"
              style="color:red"></span>

        <button type="submit">Add</button>

    </form>
</body>
