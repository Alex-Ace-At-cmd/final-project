<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movies</title>
</head>

<body>

<h1>Your List</h1>

<table>

    <thead>
        <th>Name</th>
        <th>Year</th>
        <th>Director</th>
    </thead>
    <tbody>
    <tr th:each="movie: ${movies}">
        <td th:text="${movie.name}"></td>
        <td th:text="${movie.year}"></td>
        <td th:text="${movie.director}"></td>

    </tr>
    </tbody>



</table>

</body>
